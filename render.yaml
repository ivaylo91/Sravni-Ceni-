# Render Blueprint за бекенда: Dashboard → New → Blueprint → изберете това репо.
# Стойностите с sync: false се въвеждат в Render (не се пазят в git).
services:
  - type: web
    name: sravni-ceni-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Дневният импорт се прави от GitHub Actions (.github/workflows/daily-import.yml)
      - key: IMPORT_ENABLED
        value: "false"
